# Builds the tool and runs its unit tests on a macOS runner: on pushes to main, on pull requests,
# and when started by hand ("Run workflow" on the Actions tab, or `gh workflow run ci.yml`).
#
# The `inputs` are empty for push and pull_request events; the expressions below fall
# back to the repository variables CI_RUNNER / CI_XCODE (Settings → Secrets and variables →
# Actions → Variables) and then to the defaults. Package.swift needs Swift tools 6.3; the
# standard macOS image (Xcode 26.6, Swift 6.3.3) has it. See docs/ci.md.
name: CI

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label (must provide an Xcode with Swift 6.3 or later)"
        required: false
        default: ""
      xcode:
        description: "Xcode version to select, e.g. 27.2 (empty: the runner's default)"
        required: false
        default: ""
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    # Pushes run the tests only in RyoHirota68/xcmutate, not in copies of it; a run started by hand runs anywhere
    if: github.event_name != 'push' || github.repository == 'RyoHirota68/xcmutate'
    runs-on: ${{ inputs.runner || vars.CI_RUNNER || 'macos-latest' }}
    timeout-minutes: 30
    env:
      XCODE_VERSION: ${{ inputs.xcode || vars.CI_XCODE || '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        if: env.XCODE_VERSION != ''
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          ls /Applications | grep -i xcode

      - name: Build
        run: swift build

      # The unit tests need no simulator. ExecutionOracleTests compiles and runs small
      # programs with `xcrun swiftc`.
      - name: Test
        run: swift test
