# Mutation testing of a Swift package on macOS (no simulator): the lines a pull request changes.
#
# Checked on GitHub with a workflow of the same shape, on a Swift package and a pull request (docs/ci.md).
name: Mutation testing (Swift package)

on: pull_request

permissions:
  contents: read

jobs:
  mutation:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: RyoHirota68/xcmutate@v0.14.0
        with:
          package: .
          scheme: MyLibrary          # see `xcodebuild -list`: the product's name, or <name>-Package with no product or several
          destination: platform=macOS
          fail-on-survived: true
